---
name: Spellcheck

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  check:
    runs-on: ubuntu-latest
    name: Spellcheck
    permissions:
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install spelling package
        run: |
          install.packages("spelling", dependencies = TRUE)
        shell: Rscript {0}

      - name: Run spellcheck on Quarto files
        run: |
          qmd_files <- list.files(pattern = "\\.qmd$", recursive = TRUE, full.names = TRUE)
          if (length(qmd_files) > 0) {
            results <- spelling::spell_check_files(qmd_files)
            if (nrow(results) > 0) {
              print(results)
              stop("Spelling errors found!")
            } else {
              cat("No spelling errors found.\n")
            }
          } else {
            cat("No .qmd files found to check.\n")
          }
        shell: Rscript {0}
